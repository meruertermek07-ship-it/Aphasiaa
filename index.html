<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тілашар | Логопедиялық платформа</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- БАСТЫ БЕТ -->
<section id="homePage" class="home-page">
    <div class="home-content">
        <div class="home-label">
            ЛОГОПЕДИЯЛЫҚ ТҮЗЕТУ ПЛАТФОРМАСЫ
        </div>
        <h1>ТІЛАШАР</h1>
        <p>
            Сөйлеуді дамыту және түзетуге арналған
            интерактивті білім беру кеңістігі
        </p>
        <button onclick="enterSite()" class="enter-button">
            КІРУ
        </button>
    </div>
</section>
<!-- НЕГІЗГІ МӘЗІР -->
<section id="mainPage" class="main-page hidden">
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="brand">
                ТІЛАШАР
            </a>
        </div>
        <div class="header-right">
            <a href="logoped.html" class="header-label">
                ЛОГОПЕД КАБИНЕТІ
                <span>↗</span>
            </a>
        </div>
    </header>
    <main class="main-container">
        <div class="main-heading">
            <span>ТІЛАШАР ПЛАТФОРМАСЫ</span>
            <h2>Сөйлеу әлеміне қош келдіңіз!</h2>
            <p>
                Өзіңізге қажетті түзету бағытын таңдаңыз.
            </p>
        </div>
        <div class="sections-grid">
            <button class="section-card"
                onclick="openSection('breathing')">
                <span>01</span>
                <h3>Тыныс алу</h3>
                <p>Сөйлеу тынысын дамыту</p>
            </button>
            <button class="section-card"
                onclick="openSection('articulation')">
                <span>02</span>
                <h3>Артикуляция</h3>
                <p>Артикуляциялық дағдылар</p>
            </button>
            <button class="section-card"
                onclick="openSection('vocabulary')">
                <span>03</span>
                <h3>Сөздік қор</h3>
                <p>Сөздерді белсендіру</p>
            </button>
            <button class="section-card"
                onclick="openSection('understanding')">
                <span>04</span>
                <h3>Сөйлеуді түсіну</h3>
                <p>Сөз бен сөйлем мағынасын түсіну</p>
            </button>
            <button class="section-card"
                onclick="openSection('speech')">
                <span>05</span>
                <h3>Сөйлеуді қалыптастыру</h3>
                <p>Ауызша сөйлеуді дамыту</p>
            </button>
            <button class="section-card"
                onclick="openSection('reading')">
                <span>06</span>
                <h3>Оқу және жазу</h3>
                <p>Оқу-жазу дағдылары</p>
            </button>
            <button class="section-card"
                onclick="openSection('logorhythmics')">
                <span>07</span>
                <h3>Логоритмика</h3>
                <p>Қозғалыс пен сөйлеуді үйлестіру</p>
            </button>
            <button class="section-card"
                onclick="openSection('results')">
                <span>08</span>
                <h3>Нәтижелер</h3>
                <p>Жұмыс барысын бақылау</p>
            </button>
        </div>
    </main>
</section>
<!-- БӨЛІМДЕРДІҢ ІШКІ БЕТІ -->
<section id="sectionPage" class="section-page hidden">
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="brand">
                ТІЛАШАР
            </a>
        </div>
        <div class="header-right">
            <a href="logoped.html" class="header-label">
                ЛОГОПЕД КАБИНЕТІ ↗
            </a>
        </div>
    </header>
    <main class="main-container">
        <button onclick="backToMenu()" class="back-button">
            ← Басты мәзірге оралу
        </button>
        <div class="section-content">
            <span id="sectionNumber"></span>
            <h2 id="selectedTitle"></h2>
            <p id="selectedDescription"></p>
            <div id="sectionInformation"></div>
            <div id="taskContent"></div>
        </div>
    </main>
</section>
<script src="script.js"></script>
</body>
</html>
